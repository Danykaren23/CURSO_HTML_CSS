<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panel de Equipos</title>

    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <div class="dashboard">

    
        <section class="estadisticas">

            <div class="tarjeta azul">
                <div class="icono">💻</div>
                <p>Total de equipos</p>
                <h2>120</h2>
                <small>Equipos registrados</small>
            </div>

            <div class="tarjeta verde">
                <div class="icono">✔</div>
                <p>Equipos operativos</p>
                <h2>95</h2>
                <small>Equipos funcionando</small>
            </div>

            <div class="tarjeta rojo">
                <div class="icono">🔧</div>
                <p>En mantenimiento</p>
                <h2>15</h2>
                <small>Equipos en revisión</small>
            </div>

            <div class="tarjeta naranja">
                <div class="icono">⚠️</div>
                <p>Incidencias pendientes</p>
                <h2>10</h2>
                <small>Por resolver</small>
            </div>

        </section>

    </div>

</body>
</html>
