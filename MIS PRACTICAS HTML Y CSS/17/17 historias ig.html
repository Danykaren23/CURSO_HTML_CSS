<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historias Instagram</title>
    <link rel="stylesheet" href="estilos17.css">
</head>
<body>
    <div class="instagram-header">
        <h1>Instagram</h1>
        <div class="icons">
            <span class="heart-icon">♡</span>
            <span class="message-icon">✉️<span class="badge">1</span></span>
        </div>
    </div>
    <div class="stories-container">
        <div class="story">
            <div class="outer-border own-story">
                <div class="border">
                    <img src="imagen/perfil1.jpg" alt="Dany">
                </div>
                <span class="plus-icon">+</span>
            </div>
            <span>Dany</span>
        </div>
        <div class="story">
            <div class="outer-border has-story">
                <div class="border">
                    <img src="imagen/perfil2.jpg" alt="Luis">
                </div>
            </div>
            <span>Luis</span>
        </div>
        <div class="story">
            <div class="outer-border has-story">
                <div class="border">
                    <img src="imagen/perfil3.jpg" alt="Sofía">
                </div>
            </div>
            <span>Sofía</span>
        </div>
        <div class="story">
            <div class="outer-border has-story">
                <div class="border">
                    <img src="imagen/perfil4.jpg" alt="Diego">
                </div>
            </div>
            <span>Diego</span>
        </div>
        <div class="story">
            <div class="outer-border has-story">
                <div class="border">
                    <img src="imagen/perfil5.jpg" alt="Valeria">
                </div>
            </div>
            <span>Valeria</span>
        </div>
    </div>
</body>
</html>
