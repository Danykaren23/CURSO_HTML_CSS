<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barras de progreso</title>
    <link rel="stylesheet" href="estilos6.css">
</head>

<body>
    <h1>BARRAS DE PROCESO</h1>

    <div class="contenedor">

        <div class="progressbar-container">
            <div class="outer-box">
                <div class="inner-box">50%</div>

                <svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="200" height="200">
                    <defs>
                        <linearGradient id="GradientColor1">
                            <stop offset="0%" stop-color="#e91e63"/>
                            <stop offset="100%" stop-color="#673ab7"/>
                        </linearGradient>
                    </defs>

                    <circle cx="100" cy="100" r="80" stroke-linecap="round"/>
                </svg>

            </div>
        </div>

        <div class="progressbar-container">
            <div class="outer-box">
                <div class="inner-box">100%</div>

                <svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="200" height="200">
                    <defs>
                        <linearGradient id="GradientColor2">
                            <stop offset="0%" stop-color="#116485"/>
                            <stop offset="100%" stop-color="#EDDD53"/>
                        </linearGradient>
                    </defs>

                    <circle cx="100" cy="100" r="80" stroke-linecap="round"/>
                </svg>

            </div>
        </div>

    </div>

</body>
</html>
