<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SELECCIÓN DE SERVICIOS</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="estilos8.css">
</head>
<body>
    <div class="container">
        <h1>SELECCIÓN DE SERVICIOS</h1>
        <h3>Servicios disponibles</h3>

        <label class="checkbox-container">
            Internet Hogar
            <input type="checkbox">
            <span class="checkmark">
                <span class="material-icons">check</span>
            </span>
        </label>

        <label class="checkbox-container">
            Fibra Óptica
            <input type="checkbox">
            <span class="checkmark">
                <span class="material-icons">check</span>
            </span>
        </label>

        <label class="checkbox-container">
            Soporte Técnico
            <input type="checkbox">
            <span class="checkmark">
                <span class="material-icons">check</span>
            </span>
        </label>

        <label class="checkbox-container">
            Instalación Gratis
            <input type="checkbox">
            <span class="checkmark">
                <span class="material-icons">check</span>
            </span>
        </label>

        <h3>Seleccione un plan</h3>

        <label class="checkbox-container">
            Plan Básico - 50 Mbps
            <input type="radio" name="plan">
            <span class="checkmark radio">
                <span class="circle"></span>
            </span>
        </label>

        <label class="checkbox-container">
            Plan Hogar - 100 Mbps
            <input type="radio" name="plan">
            <span class="checkmark radio">
                <span class="circle"></span>
            </span>
        </label>

        <label class="checkbox-container">
            Plan Empresarial - 300 Mbps
            <input type="radio" name="plan">
            <span class="checkmark radio">
                <span class="circle"></span>
            </span>
        </label>

        <label class="checkbox-container">
            Plan Fibra Máxima - 1 Gbps
            <input type="radio" name="plan">
            <span class="checkmark radio">
                <span class="circle"></span>
            </span>
        </label>
    </div>
</body>
</html>
