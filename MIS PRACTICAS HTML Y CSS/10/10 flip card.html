<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flip Card</title>

    <link rel="stylesheet" href="estilos10.css" />
</head>

<body>

<h1>ROSAS</h1>

<div class="cards">


    <div class="flip-card rojo">
        <div class="flip-card-inner">

            <div class="flip-card-front">
                <img 
                src="imagen/rojo.jpg" 
                alt="Rosa Roja"
                style="width:300px; height:300px;">
            </div>

            <div class="flip-card-back">
                <h1>Rosa Roja</h1>
                <p>Representa amor y pasión.</p>
            </div>

        </div>
    </div>



    <div class="flip-card amarillo">
        <div class="flip-card-inner">

            <div class="flip-card-front">
                <img 
                src="imagen/amarrilla.jpg" 
                alt="Rosa Amarilla"
                style="width:300px; height:300px;">
            </div>

            <div class="flip-card-back">
                <h1>Rosa Amarilla</h1>
                <p>Representa alegría y amistad.</p>
            </div>

        </div>
    </div>



    <div class="flip-card celeste">
        <div class="flip-card-inner">

            <div class="flip-card-front">
                <img 
                src="imagen/celeste.jpg" 
                alt="Rosa Celeste"
                style="width:300px; height:300px;">
            </div>

            <div class="flip-card-back">
                <h1>Rosa Celeste</h1>
                <p>Representa calma y tranquilidad.</p>
            </div>

        </div>
    </div>



    <div class="flip-card blanco">
        <div class="flip-card-inner">

            <div class="flip-card-front">
                <img 
                src="imagen/blanco.jpg" 
                alt="Rosa Blanca"
                style="width:300px; height:300px;">
            </div>

            <div class="flip-card-back">
                <h1>Rosa Blanca</h1>
                <p>Representa pureza y paz.</p>
            </div>

        </div>
    </div>


</div>

</body>
</html>
