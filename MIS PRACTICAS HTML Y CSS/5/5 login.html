<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión y Registro</title>
    <link rel="stylesheet" href="estilos5.css">
</head>
<body>
    <div class="form-container">
        <!-- Sección: Inicio de Sesión -->
        <div class="login-container">
            <h2>Bienvenido</h2>
            <p>Inicia sesión para acceder a tu cuenta.</p>
            <form action="#">
                <p>
                    <label for="username">Usuario</label>
                    <input class="input" type="text" id="username" name="username" placeholder="Ingresa tu usuario" required>
                </p>
                <p>
                    <label for="password">Contraseña</label>
                    <input class="input" type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                </p>
                <div class="options">
                    <div>
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Recordarme</label>
                    </div>
                    <div>
                        <a href="#">¿Olvidaste tu contraseña?</a>
                    </div>
                </div>
                <p>
                    <input class="btn btn-login" type="submit" value="Iniciar Sesión">
                </p>
                <div class="providers">
                    <span>O inicia sesión con:</span>
                    <button type="button" class="btn google-provider">Google</button>
                    <button type="button" class="btn facebook-provider">Facebook</button>
                    <button type="button" class="btn twitter-provider">Twitter</button>
                </div>
                <p class="register">
                    ¿No tienes una cuenta?
                    <a href="#">Crear cuenta</a>
                </p>
            </form>
        </div>

        <!-- Sección: Registro -->
        <div class="welcome-screen-container">
            <h1>Crear Cuenta</h1>
            <p>Regístrate para disfrutar de todas las funciones.</p>
            <form action="#">
                <p>
                    <label for="nombre">Nombres</label>
                    <input class="input" type="text" id="nombre" placeholder="Ingresa tus nombres">
                </p>
                <p>
                    <label for="apellido">Apellidos</label>
                    <input class="input" type="text" id="apellido" placeholder="Ingresa tus apellidos">
                </p>
                <p>
                    <label for="correo">Correo Electrónico</label>
                    <input class="input" type="email" id="correo" placeholder="ejemplo@gmail.com">
                </p>
                <p>
                    <label for="telefono">Teléfono</label>
                    <input class="input" type="tel" id="telefono" placeholder="987654321">
                </p>
                <p>
                    <label for="pass">Contraseña</label>
                    <input class="input" type="password" id="pass" placeholder="********">
                </p>
                <p>
                    <label for="pass2">Confirmar Contraseña</label>
                    <input class="input" type="password" id="pass2" placeholder="********">
                </p>
                <p>
                    <input type="checkbox" id="aceptar">
                    <label for="aceptar">Acepto los términos y condiciones</label>
                </p>
                <p>
                    <input class="btn btn-register" type="submit" value="Crear Cuenta">
                </p>
            </form>
        </div>
    </div>
</body>
</html>
