<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hilo</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link rel="stylesheet" href="estilos13.css" />
</head>
<body>
    <nav>
        <header>
            <div class="bar"></div>
            <div class="user">
                <img src="imagen/perfil.jpg" alt="Foto de perfil" />
                <div class="name">Daniela Mendoza</div>
                
            </div>
        </header>

        <div class="links">
            <a href="#" class="active">
                <div class="icon">
                    <span class="iconify" data-icon="flat-color-icons:assistant" data-width="32" data-height="32"></span>
                </div>
                <div class="title">Asistencia Remota</div>
            </a>
            <a href="#">
                <div class="icon">
                    <span class="iconify" data-icon="flat-color-icons:calendar" data-width="32" data-height="32"></span>
                </div>
                <div class="title">Calendario</div>
            </a>
            <a href="#">
                <div class="icon">
                    <span class="iconify" data-icon="flat-color-icons:automatic" data-width="32" data-height="32"></span>
                </div>
                <div class="title">Configuración</div>
            </a>
            <a href="#">
                <div class="icon">
                    <span class="iconify" data-icon="flat-color-icons:bearish" data-width="32" data-height="32"></span>
                </div>
                <div class="title">Estadísticas</div>
            </a>
            <a href="#">
                <div class="icon">
                    <span class="iconify" data-icon="flat-color-icons:compact-camera" data-width="32" data-height="32"></span>
                </div>
                <div class="title">Fotos</div>
            </a>
        </div>

        <div class="divider"></div>

        <div class="links bottom">
            <a href="#">
                <div class="icon">
                    <span class="material-icons">help_outline</span>
                </div>
                <div class="title">Ayuda</div>
            </a>
            <a href="#">
                <div class="icon">
                    <span class="material-icons">logout</span>
                </div>
                <div class="title">Cerrar Sesión</div>
            </a>
        </div>
    </nav>

    <script src="https://code.iconify.design/2/2.1.2/iconify.min.js"></script>
</body>
</html>
